<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" fill="none">
  <!-- Hero backdrop: soft accent-blue glow + faint grid on #F8FAFC (Alyson brand). Place behind the hero, object-fit: cover. -->
  <defs>
    <radialGradient id="glow" cx="50%" cy="38%" r="55%">
      <stop offset="0%" stop-color="#2563EB" stop-opacity="0.16"/>
      <stop offset="45%" stop-color="#3B82F6" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#F8FAFC" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" stroke="#E5E7EB" stroke-width="1"/>
    </pattern>
    <radialGradient id="fade" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#fff" stop-opacity="1"/>
      <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <mask id="gridMask"><rect width="1600" height="900" fill="url(#fade)"/></mask>
  </defs>
  <rect width="1600" height="900" fill="#F8FAFC"/>
  <rect width="1600" height="900" fill="url(#grid)" mask="url(#gridMask)" opacity="0.7"/>
  <rect width="1600" height="900" fill="url(#glow)"/>
  <!-- two thin orbit arcs, like the reference hero -->
  <ellipse cx="800" cy="520" rx="640" ry="300" stroke="#2563EB" stroke-opacity="0.10" stroke-width="1.5"/>
  <ellipse cx="800" cy="520" rx="480" ry="220" stroke="#2563EB" stroke-opacity="0.07" stroke-width="1.5"/>
</svg>
